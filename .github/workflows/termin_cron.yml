name: Termin Cron

on:
  schedule:
    - cron: "*/30 7-13 * * 1-5"
      timezone: "Europe/Berlin"
    - cron: "0 14 * * 1-5"
      timezone: "Europe/Berlin"
  workflow_dispatch:

jobs:
  check-appointments:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run appointment checker
        env:
          TERMIN_URL: ${{ secrets.TERMIN_URL }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}

          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SES_CONFIGURATION_SET: ${{ secrets.AWS_SES_CONFIGURATION_SET }}

          EMAIL_IDS: ${{ secrets.EMAIL_IDS }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MAXIMUM_ENTRIES: ${{ secrets.MAXIMUM_ENTRIES }}
          DEBUG: ${{ secrets.DEBUG }}

          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}

          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ALLOWED_DOMAINS: ${{ secrets.ALLOWED_DOMAINS }}

        run: |
          python main.py
